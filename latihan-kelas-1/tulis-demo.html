<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uji Tulisan Tangan</title>
<style>
  body{margin:0;background:#FFF3D1;color:#3b2a1c;font:600 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 16px;color:#7a6450}
  .card{background:#fffdf7;border:2px solid #efe2c6;border-radius:18px;padding:16px}
  .q{font-size:20px;margin:0 0 12px}
  label{display:block;font-size:14px;color:#6b543f;margin:14px 0 6px}
  input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:2px solid #e6d9bf;border-radius:10px;background:#fff}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:800;font-size:17px;min-height:48px;padding:8px 22px;border-radius:12px;border:0;background:#f2a93b;color:#3b2a1c;cursor:pointer}
  .btn.alt{background:#fff;border:2px solid #e6d9bf;font-weight:700}
  .btn:disabled{opacity:.5}
  #hasil{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff;border:2px dashed #e6d9bf;min-height:24px}
  #hasil .big{font-size:22px;font-weight:800}
  #hasil .ok{color:#2f7d32}#hasil .no{color:#b23b2e}
  #hasil small{color:#7a6450;display:block;margin-top:4px;word-break:break-word}
  #png{display:block;max-width:100%;margin-top:10px;border:1px solid #eee;border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>Uji Tulisan Tangan</h1>
  <p class="sub">Tulis jawaban dengan jari atau pena, lalu tekan Jawab.</p>
  <div class="card">
    <p class="q">7 + 5 = ?</p>
    <div id="pad"></div>
    <label for="terima">Jawaban yang diterima (pisahkan dengan koma)</label>
    <input id="terima" type="text" value="12, dua belas">
    <div class="row">
      <button id="jawab" class="btn" type="button" disabled>Jawab</button>
      <button id="lagi" class="btn alt" type="button" hidden>Coba lagi</button>
    </div>
    <div id="hasil" aria-live="polite">Belum ada jawaban.</div>
  </div>
</main>
<script src="./tulis.js"></script>
<script>
(function () {
  var pad = Tulis.create(document.getElementById('pad'));
  var bJawab = document.getElementById('jawab');
  var bLagi = document.getElementById('lagi');
  var hasil = document.getElementById('hasil');
  window.demoPad = pad;

  pad.onchange = function () { bJawab.disabled = pad.isEmpty(); };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  bJawab.addEventListener('click', function () {
    if (pad.isEmpty()) return;
    pad.lock();
    bJawab.disabled = true;
    hasil.textContent = 'Sedang membaca tulisan…';
    var accepted = document.getElementById('terima').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    Tulis.recognize(pad, { lang: 'id', words: accepted }).then(function (r) {
      var best = r.candidates[0];
      var m = Tulis.match(r.candidates, accepted);
      window.demoLast = { result: r, match: m };
      hasil.innerHTML =
        '<div class="big">Terbaca: ' + (best ? esc(best) : '<em>(tidak terbaca)</em>') + '</div>' +
        '<div class="' + (m.ok ? 'ok' : 'no') + '">' + (m.ok ? 'Cocok dengan "' + esc(m.matched) + '"' : 'Belum cocok') + '</div>' +
        '<small>Mesin: ' + esc(r.engine) + '</small>' +
        '<small>Semua kandidat: ' + (r.candidates.length ? esc(r.candidates.join(' · ')) : '—') + '</small>' +
        '<img id="png" alt="Gambar tulisan" src="' + pad.toPNG() + '">';
      bLagi.hidden = false;
    });
  });

  bLagi.addEventListener('click', function () {
    pad.unlock();
    pad.clear();
    bLagi.hidden = true;
    hasil.textContent = 'Belum ada jawaban.';
  });
})();
</script>
</body>
</html>
