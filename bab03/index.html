<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kebun Ketimun Kakek Ramlan · Kota Kancil</title>
<meta name="theme-color" content="#A6DCEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../kit/ui.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Pagi di pasar: langit krem ke persik, tinta cokelat, aksen jingga tebu. Adegan 3D memenuhi layar; UI hanya menempel di tepi. */
  --sky-top: #BFE6F2; --sky-bottom: #FFE9B8; --ink: #3B2614; --ink-soft: #7A5B3E; --card: #FFFCF3; --line: #F0D9A0;
  --accent: #E8742A; --accent-deep: #C25A18; --leaf: #4E9A3C; --jali: #2F8FD0;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #A6DCEA; color: var(--ink); font-family: var(--body); font-weight: 700; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

.hud { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; z-index: 3; }
.hud > * { pointer-events: auto; }
.place { font-family: var(--display); font-weight: 800; font-size: 20px; background: var(--card); border: 3px solid var(--line); border-radius: 999px; padding: 4px 16px; }
.chip { margin-left: auto; font-size: 14px; background: var(--card); border: 3px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--ink-soft); }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); display: grid; place-items: center; position: relative; }
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn[aria-pressed="false"]::after { content: ""; position: absolute; width: 30px; height: 3px; background: var(--ink); transform: rotate(-45deg); border-radius: 2px; }

#top { position: fixed; left: 0; right: 0; top: calc(66px + env(safe-area-inset-top)); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 12px; }
#bubble { width: max-content; max-width: min(460px, calc(100vw - 24px)); background: var(--card); border: 3px solid var(--line); border-left-width: 10px; border-left-color: var(--accent); border-radius: 20px; padding: 8px 16px 10px; pointer-events: none; box-shadow: 0 6px 0 rgba(59,38,20,.12); }
#bubble[data-who="jali"] { border-color: var(--jali); }
#bubble[data-who="sari"] { border-left-color: #E8574B; }
#who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
#bubble[data-who="jali"] #who { color: var(--jali); }
#msg { font-size: 18px; line-height: 1.3; }

#alert { position: fixed; left: 0; top: 0; z-index: 1; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #fff; font-family: var(--display); font-weight: 800; font-size: 40px; display: grid; place-items: center; border: 4px solid #fff; box-shadow: 0 4px 0 var(--accent-deep); pointer-events: none; }

#ask { position: fixed; left: 0; top: 0; z-index: 1; background: var(--card); border: 4px solid var(--ink, #3b2614); border-radius: 22px; padding: 6px 14px 8px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 0 rgba(59,38,20,.18); pointer-events: none; }
#ask img { width: 64px; height: 64px; } #ask div { display: grid; grid-template-columns: repeat(3, 20px); gap: 5px; } #ask u { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--accent); } #ask u.on { background: var(--accent); }
#order { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 10px; z-index: 3; }
.want { white-space: nowrap; display: flex; align-items: baseline; gap: 4px; background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 6px 16px 6px 8px; box-shadow: 0 5px 0 rgba(59,38,20,.12); }
.want img { width: 54px; height: 54px; align-self: center; }
.want b { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.want span { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--ink-soft); }
.want i { font-style: normal; font-size: 14px; color: var(--ink-soft); margin-left: 6px; align-self: center; }
.want.done { border-color: var(--leaf); } .want.done b { color: var(--leaf); }

#rotate { display: none; position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 3; font-size: 13px; color: var(--ink-soft); background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap; pointer-events: none; }
#intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: end center; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); transition: opacity .4s, visibility .4s; }
#intro.gone { opacity: 0; visibility: hidden; }
.intro-card { background: rgba(255,252,243,.94); border: 3px solid var(--line); border-radius: 28px; padding: 18px 22px 20px; text-align: center; width: min(100%, 440px); display: flex; flex-direction: column; gap: 10px; align-items: center; }
h1 { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; margin: 0; text-wrap: balance; } h1 span { color: var(--leaf); }
.lead { margin: 0; font-size: 17px; line-height: 1.35; max-width: 30ch; }
.btn { border-radius: 20px; min-height: 64px; min-width: 220px; padding: 8px 22px; font-family: var(--display); font-weight: 800; font-size: 24px; border: 3px solid var(--accent-deep); background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-deep); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; } .btn:disabled { opacity: .5; }
#loading { font-size: 14px; color: var(--ink-soft); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .7; } }
@media (max-width: 480px) { #ask img { width: 50px; height: 50px; } #ask div { grid-template-columns: repeat(3, 16px); } #ask u { width: 16px; height: 16px; } #msg { font-size: 16px; } .want b { font-size: 32px; } .want img { width: 44px; height: 44px; } .place { font-size: 17px; } h1 { font-size: 34px; } }

a.place { text-decoration: none; color: var(--ink); white-space: nowrap; } .chip { white-space: nowrap; }
@media (max-width: 480px) { a.place { font-size: 15px; padding: 4px 12px; } .chip { font-size: 13px; padding: 5px 10px; } }
.chip { display: flex; align-items: center; gap: 5px; font-weight: 800; }
.chip u { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--leaf); display: inline-block; } .chip u.on { background: var(--leaf); }
#eq { display: flex; align-items: center; gap: 8px; background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 4px 16px; box-shadow: 0 5px 0 rgba(59,38,20,.12); }
#eq svg { width: 40px; height: 20px; }
#eq b { font-family: var(--display); font-weight: 800; font-size: 42px; line-height: 1.05; font-variant-numeric: tabular-nums; min-width: 1ch; text-align: center; }
#eq em { font-style: normal; font-family: var(--display); font-weight: 800; font-size: 34px; color: var(--ink-soft); }
#eq b.q { min-width: 58px; border-radius: 14px; background: #FFE2C4; color: var(--accent); border: 3px dashed var(--accent); padding: 0 6px; }
#eq b.q.ok { background: var(--leaf); color: #fff; border-style: solid; border-color: #2f6b22; }
#eq[data-who="kancil"] { border-color: #E8574B; background: #FFF1EC; } #eq i { font-style: normal; font-size: 14px; color: #c23f35; }
@media (max-width: 480px) { #eq b { font-size: 36px; } #eq em { font-size: 28px; } #eq { gap: 6px; padding: 3px 12px; } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <a class="place" href="../cerita/">Kebun Kakek Ramlan</a>
  <div class="chip" id="stage">Tahap 1/3</div>
  <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Suara"><svg viewBox="0 0 24 24" fill="none" stroke="#3B2614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#FCE7C8"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
</div>
<div id="top"><div id="bubble" hidden><div id="who"></div><div id="msg"></div></div><div id="eq" hidden></div></div>

<div id="intro"><div class="intro-card">
  <h1>Kebun Ketimun <span>Kakek Ramlan</span></h1>
  <p class="lead">Kancil bekerja membantu panen. Jadilah gurunya: cari angka yang hilang!</p>
  <button class="btn" id="startBtn" disabled>Mulai panen</button>
  <div id="loading">Menata kebun...</div>
</div></div>
<script>
(function () {
  var show = function (m) { var l = document.getElementById('loading'); if (l) l.textContent = 'Ada gangguan: ' + m; };
  addEventListener('error', function (e) { show(e.message || 'berkas gagal dimuat'); }, true);
  addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason); });
  try { var c = document.createElement('canvas'); if (!c.getContext('webgl2')) show('browser ini belum mendukung WebGL2. Coba Chrome atau Safari terbaru.'); } catch (e) { show('grafis 3D tidak tersedia.'); }
  setTimeout(function () { var l = document.getElementById('loading'); if (l && l.textContent.indexOf('Menata') === 0) l.textContent = 'Masih memuat... kalau lama, tutup lalu buka lagi halaman ini.'; }, 20000);
})();
</script>
<script src="../kit/ui.js"></script>
<script src="./app.bundle.js"></script>
</body>
</html>
